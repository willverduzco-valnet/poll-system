<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poll Link Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: #f5f5f5;
    color: #222;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .container { max-width: 640px; width: 100%; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .subtitle { color: #888; font-size: 14px; margin: 0 0 32px; }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 28px 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    margin-bottom: 20px;
  }

  #auth-section { text-align: center; }
  #auth-section p { color: #666; margin: 0 0 20px; line-height: 1.6; }

  .btn-google {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    color: #333;
  }
  .btn-google:hover { border-color: #1a73e8; color: #1a73e8; }
  .btn-google img { width: 20px; height: 20px; }

  #app-section { display: none; }

  #loading {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    display: none;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #e0e0e0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error-section {
    display: none;
    text-align: center;
    padding: 20px;
  }
  #error-section p { color: #d32f2f; margin: 0 0 16px; }
  .btn-retry {
    background: none;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-retry:hover { border-color: #1a73e8; color: #1a73e8; }
</style>
</head>
<body>
<div class="container">
  <h1>Poll Link Generator</h1>
  <p class="subtitle">Create trackable poll voting links for newsletters</p>

  <!-- Auth gate -->
  <div id="auth-section" class="card">
    <p>Sign in with your authorized Google account to access this tool.</p>
    <button class="btn-google" onclick="handleSignIn()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
      Sign in with Google
    </button>
  </div>

  <!-- Loading state -->
  <div id="loading" class="card">
    <div class="spinner"></div>
    <p>Loading tool...</p>
  </div>

  <!-- Error state -->
  <div id="error-section" class="card">
    <p id="error-msg">Unable to load. You may not have access.</p>
    <button class="btn-retry" onclick="handleSignIn()">Try again</button>
  </div>

  <!-- App tabs (shown after auth) -->
  <div id="app-tabs" style="display:none;">
    <div style="display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid #ddd;margin-bottom:20px;">
      <button class="app-tab active" data-target="app-section" onclick="switchAppTab(this)" style="flex:1;padding:10px 0;font-size:14px;font-weight:600;border:none;cursor:pointer;background:#1a1a1a;color:#fff;transition:all .15s;">Poll Creator</button>
      <button class="app-tab" data-target="manager-section" onclick="switchAppTab(this)" style="flex:1;padding:10px 0;font-size:14px;font-weight:600;border:none;cursor:pointer;background:#fff;color:#333;transition:all .15s;">Landing Poll Manager</button>
    </div>
  </div>

  <!-- App content (injected by pollgenerator-cf.js) -->
  <div id="app-section"></div>

  <!-- Manager content (injected by poll-manager.js) -->
  <div id="manager-section" style="display:none;"></div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script>
(function() {
  var GCP_CLIENT_ID = '1026548183269-jebk6532n8767q35il7ruft9fb4rmar6.apps.googleusercontent.com';
  var DRIVE_FILES = {
    generator: '1K71ZfrkNoZg7FIuEUeZgLY7gOC3n643n',  // pollgenerator-cf.js
    manager:   '11hQjmJoqBMYe3viJFRZNMJ1_9Mf7Yb5j'   // poll-manager.js
  };

  var tokenClient;

  window.switchAppTab = function(btn) {
    document.querySelectorAll('.app-tab').forEach(function(b) {
      b.style.background = '#fff'; b.style.color = '#333';
    });
    btn.style.background = '#1a1a1a'; btn.style.color = '#fff';
    document.getElementById('app-section').style.display = 'none';
    document.getElementById('manager-section').style.display = 'none';
    document.getElementById(btn.dataset.target).style.display = 'block';
  };

  window.handleSignIn = function() {
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('error-section').style.display = 'none';
    document.getElementById('loading').style.display = 'block';

    if (!tokenClient) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GCP_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: onTokenResponse
      });
    }
    tokenClient.requestAccessToken();
  };

  function onTokenResponse(resp) {
    if (resp.error) {
      showError('Authentication failed. Please try again.');
      return;
    }
    loadScripts(resp.access_token);
  }

  function fetchDriveFile(fileId, accessToken) {
    return fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {
      headers: { 'Authorization': 'Bearer ' + accessToken }
    }).then(function(r) {
      if (!r.ok) return null;
      return r.text();
    }).catch(function() { return null; });
  }

  function loadScripts(accessToken) {
    // Load generator (required) and manager (optional — access-restricted)
    Promise.all([
      fetchDriveFile(DRIVE_FILES.generator, accessToken),
      fetchDriveFile(DRIVE_FILES.manager, accessToken)
    ]).then(function(results) {
      var generatorJs = results[0];
      var managerJs = results[1];

      if (!generatorJs) {
        showError('Unable to load poll creator. You may not have access.');
        return;
      }

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app-tabs').style.display = 'block';
      document.getElementById('app-section').style.display = 'block';

      // Execute generator script
      var s1 = document.createElement('script');
      s1.textContent = generatorJs;
      document.body.appendChild(s1);

      // Execute manager script if user has access
      if (managerJs) {
        var s2 = document.createElement('script');
        s2.textContent = managerJs;
        document.body.appendChild(s2);
      } else {
        // Hide manager tab if no access
        var tabs = document.querySelectorAll('.app-tab');
        if (tabs.length > 1) tabs[1].style.display = 'none';
      }
    });
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-section').style.display = 'block';
  }
})();
</script>
</body>
</html>
